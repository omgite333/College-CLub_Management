services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the environment or root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment or root .env file}
      PORT: 5000
      FRONTEND_URL: http://localhost:8080
    ports:
      - "5000:5000"
    command: ["sh", "-c", "npx prisma migrate deploy && npm start"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
